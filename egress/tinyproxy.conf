# 重登服务唯一的出网口：只放行 allowlist 里的主机名，只允许 CONNECT 到 443。
Port 8888
Listen 0.0.0.0
Timeout 600
MaxClients 32
# 只有内部网络里的 relogin 能连到这里；网段可配置，所以放行全部私网地址
Allow 10.0.0.0/8
Allow 172.16.0.0/12
Allow 192.168.0.0/16
ConnectPort 443
DisableViaHeader Yes
Filter "/etc/tinyproxy/allowlist"
FilterType ere
FilterURLs Off
FilterDefaultDeny Yes
FilterCaseSensitive Off
LogLevel Connect
