# sub2api 自托管重登服务。relogin 在无出网路由的内部网络里，只能经 egress（主机名白名单代理）访问 OpenAI；
# egress 按邮箱到 sub2api 查该账号配置的代理，把这次登录的流量接到那个代理上。
# egress 跑在宿主机网络里：直连时和 sub2api 用同一套路由和源地址（IPv4 / IPv6 一致），
# 只监听内部网络网桥的地址 RELOGIN_GATEWAY，外网连不到。
# 可用 .env 覆盖的项见 .env.example。
name: sub2api-relogin
services:
  relogin:
    build: .
    restart: unless-stopped
    networks:
      relogin-int:
        ipv4_address: ${RELOGIN_IP:-172.31.250.10}
    environment:
      RELOGIN_LISTEN_HOST: 0.0.0.0
      RELOGIN_LISTEN_PORT: "18790"
      RELOGIN_TOKEN_FILE: /run/secrets/relogin-token
      RELOGIN_EGRESS_PROXY: http://${RELOGIN_GATEWAY:-172.31.250.1}:8888
      RELOGIN_ACCOUNT_PROXY: ${RELOGIN_ACCOUNT_PROXY:-on}
      RELOGIN_MAX_CONCURRENT: "2"
      RELOGIN_TIMEOUT_SECONDS: "600"
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ${RELOGIN_TOKEN_PATH:-/etc/sub2api-relogin/token}:/run/secrets/relogin-token:ro
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    cpus: 1
    pids_limit: 256
    depends_on: [egress]
  egress:
    build: ./egress
    restart: unless-stopped
    network_mode: host
    environment:
      EGRESS_LISTEN_HOST: ${RELOGIN_GATEWAY:-172.31.250.1}
      EGRESS_LISTEN_PORT: "8888"
      EGRESS_TOKEN_FILE: /run/secrets/relogin-token
      SUB2API_BASE_URL: ${SUB2API_BASE_URL:-}
      SUB2API_ADMIN_KEY_FILE: /run/secrets/sub2api-admin-key
    volumes:
      - ${RELOGIN_TOKEN_PATH:-/etc/sub2api-relogin/token}:/run/secrets/relogin-token:ro
      # sub2api 的 Admin API Key 只挂给 egress；跑登录的 relogin 容器拿不到
      - ${SUB2API_ADMIN_KEY_PATH:-/etc/sub2api-relogin/sub2api-admin-key}:/run/secrets/sub2api-admin-key:ro
    read_only: true
    tmpfs:
      - /tmp:size=8m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    cpus: 0.5
networks:
  relogin-int:
    internal: true
    ipam:
      config:
        - subnet: ${RELOGIN_SUBNET:-172.31.250.0/24}
          gateway: ${RELOGIN_GATEWAY:-172.31.250.1}
